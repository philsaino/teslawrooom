<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tesla Wrooom</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none}
body{
  background:#050507;
  color:#f5f5f7;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
  height:100vh;
  display:grid;
  grid-template-rows:auto 1fr auto;
  padding:28px 36px;
  overflow:hidden;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:16px;
  font-weight:600;
  letter-spacing:1px;
  color:#8e8e93;
}
.badge{
  background:#1c1c1e;
  padding:8px 16px;
  border-radius:20px;
  font-size:14px;
  color:#30d158;
}

/* Cluster centrale tipo cockpit Tesla */
.cluster{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:18px;
}
.speed-display{
  display:flex;
  align-items:baseline;
  gap:8px;
}
#speed-num{
  font-size:120px;
  font-weight:800;
  line-height:0.9;
  letter-spacing:-3px;
  font-variant-numeric:tabular-nums;
}
.speed-unit{
  font-size:28px;
  font-weight:600;
  color:#8e8e93;
}

.rpm-container{
  display:flex;
  align-items:center;
  gap:16px;
  font-size:22px;
  font-weight:600;
  color:#a1a1a6;
}
#rpm-val{
  font-size:32px;
  font-weight:700;
  color:#fff;
  font-variant-numeric:tabular-nums;
}
#gear-badge{
  background:#ff3b30;
  color:#fff;
  padding:4px 14px;
  border-radius:8px;
  font-weight:800;
  font-size:20px;
}

/* Barra tachimetro / giri stile Tesla Model 3 */
.bar-track{
  width:100%;
  max-width:720px;
  height:18px;
  background:#1c1c1e;
  border-radius:9px;
  overflow:hidden;
  box-shadow:inset 0 1px 3px rgba(0,0,0,0.8);
}
#bar-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#30d158 0%,#ffd60a 70%,#ff3b30 95%);
  transition:width .05s linear;
}

/* Pannello comandi grande per touch screen */
.dashboard-controls{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:16px;
  width:100%;
  max-width:720px;
  margin:0 auto;
}

/* Tasti modalità EV diretto vs Cambio simulato */
.mode-toggle{
  display:flex;
  width:100%;
  background:#1c1c1e;
  border-radius:14px;
  padding:4px;
  gap:4px;
}
.mode-opt{
  flex:1;
  padding:14px;
  border:0;
  background:transparent;
  color:#8e8e93;
  font-size:15px;
  font-weight:700;
  border-radius:10px;
  cursor:pointer;
  transition:all .15s ease;
}
.mode-opt.active{
  background:#2c2c2e;
  color:#fff;
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
}

/* Pulsantone Avvia/Spegni enorme touch-friendly */
.btn-power{
  width:100%;
  padding:22px;
  font-size:22px;
  font-weight:800;
  letter-spacing:1px;
  border:0;
  border-radius:16px;
  background:#ff3b30;
  color:#fff;
  cursor:pointer;
  box-shadow:0 6px 24px rgba(255,59,48,0.35);
  transition:transform .1s ease, background .15s ease;
}
.btn-power:active{
  transform:scale(0.98);
}
.btn-power.stop{
  background:#2c2c2e;
  box-shadow:none;
}
.btn-power:disabled{
  opacity:0.4;
  cursor:not-allowed;
}

/* Slider test banco */
.sim-box{
  width:100%;
  display:flex;
  align-items:center;
  gap:16px;
  font-size:14px;
  color:#8e8e93;
}
.sim-box input{
  flex:1;
  height:12px;
  accent-color:#ff3b30;
  cursor:pointer;
}

.status-line{
  font-size:12px;
  color:#636366;
  text-align:center;
}
</style>
</head>
<body>

<header>
  <div>TESLA WROOOM</div>
  <div class="badge" id="gps-status">GPS IN ATTESA</div>
</header>

<div class="cluster">
  <div class="speed-display">
    <div id="speed-num">0</div>
    <div class="speed-unit">km/h</div>
  </div>

  <div class="rpm-container">
    <span id="gear-badge">D</span>
    <span><span id="rpm-val">800</span> RPM</span>
  </div>

  <div class="bar-track">
    <div id="bar-fill"></div>
  </div>
</div>

<div class="dashboard-controls">
  <div class="mode-toggle">
    <button class="mode-opt active" id="btn-ev-mode">MONOMARCIA EV (NATIVO TESLA)</button>
    <button class="mode-opt" id="btn-gear-mode">CAMBIO VIRTUAL (1-8 MARCE)</button>
  </div>

  <button id="power-btn" class="btn-power" disabled>CARICAMENTO AUDIO...</button>

  <div class="sim-box">
    <span>TEST BANCO:</span>
    <input type="range" id="sim-slider" min="0" max="260" value="0">
    <span id="sim-spd" style="min-width:65px">0 km/h</span>
  </div>

  <div class="status-line" id="diag">Download campioni...</div>
</div>

<script>
// ponytail: supporto doppio (EV monomarcia continuo vs cambio virtuale 8 marce)
const IDLE_RPM = 800, MAX_RPM = 7500;
// Rapporti cambio 8 marce (stile ZF 8HP)
const ratios = [0, 4.71, 3.14, 2.10, 1.67, 1.28, 1.00, 0.84, 0.67];
const finalDrive = 3.15;

const sampleRpmPoints = [800, 1800, 2800, 4000, 5500, 7200];
const sampleFiles = [
  'sounds/loop_0.wav',
  'sounds/loop_1.wav',
  'sounds/loop_2.wav',
  'sounds/loop_3.wav',
  'sounds/loop_4.wav',
  'sounds/loop_5.wav'
];

let actx = null, isRunning = false;
let rawAudioArrayBuffers = [];
let audioBuffers = [];
let sourceNodes = [], gainNodes = [];
let masterGain = null;
let currentSpeed = 0, targetRpm = IDLE_RPM, currentRpm = IDLE_RPM;
let gear = 1;
let filteredThrottle = 0;
let lastSpeedSample = 0, lastSpeedSampleTime = performance.now();
let lastShiftTime = 0;
let driveMode = 'ev';
let geoWatchId = null;

// Telemetria per diagnostica dal vivo
let gpsSampleCount = 0;
let lastGpsSampleTimestamp = 0;
let gpsHzDisplay = 0;
let lastAccelKmhS = 0;

function createAudioContext() {
  const AC = window.AudioContext || window.webkitAudioContext;
  // latencyHint: 'interactive' forza il buffer hardware al minimo assoluto supportato
  return new AC({ latencyHint: 'interactive' });
}

// Gestione arrivo nuovo dato di velocita (GPS o slider)
// Se isDirectInput = true (slider touch), bypassa i filtri di rate-limit per risposta immediata
function registerSpeedUpdate(spd, isDirectInput = false) {
  const now = performance.now();
  const dt = (now - lastSpeedSampleTime) / 1000;

  if (isDirectInput) {
    // Slider: risposta secca senza attendere dt minimo
    if (dt > 0.01) {
      const rawAccel = (spd - lastSpeedSample) / dt;
      lastAccelKmhS = rawAccel;
      const rawThrottle = Math.max(0, Math.min(1, rawAccel / 18));
      // Inseguimento rapido su slider
      filteredThrottle += (rawThrottle - filteredThrottle) * 0.5;
      lastSpeedSample = spd;
      lastSpeedSampleTime = now;
    }
  } else {
    // GPS auto: telemetria Hz
    gpsSampleCount++;
    if (lastGpsSampleTimestamp > 0 && dt > 0) {
      const instantHz = 1 / dt;
      gpsHzDisplay = gpsHzDisplay === 0 ? instantHz : (gpsHzDisplay * 0.8 + instantHz * 0.2);
    }
    lastGpsSampleTimestamp = now;

    if (dt > 0.04) {
      const rawAccel = (spd - lastSpeedSample) / dt;
      lastAccelKmhS = rawAccel;
      const rawThrottle = Math.max(0, Math.min(1, rawAccel / 12));
      const alpha = rawThrottle > filteredThrottle ? 0.45 : 0.15;
      filteredThrottle += (rawThrottle - filteredThrottle) * alpha;
      lastSpeedSample = spd;
      lastSpeedSampleTime = now;
    }
  }
  currentSpeed = Math.max(0, spd);
}

// Pre-caricamento e decodifica immediata all'avvio della pagina
async function preloadSamples() {
  try {
    actx = createAudioContext();

    document.getElementById('diag').textContent = 'Scaricamento audio...';
    const fetchPromises = sampleFiles.map(async file => {
      const res = await fetch(file);
      if (!res.ok) throw new Error(`HTTP ${res.status} per ${file}`);
      const arrayBuf = await res.arrayBuffer();
      return await decodeAudioCompat(actx, arrayBuf);
    });

    audioBuffers = await Promise.all(fetchPromises);

    const btn = document.getElementById('power-btn');
    btn.disabled = false;
    btn.textContent = 'AVVIA MOTORE';
    updateDiagStatus();
  } catch (err) {
    document.getElementById('diag').textContent = 'Errore suoni: ' + err.message;
  }
}
preloadSamples();

function decodeAudioCompat(context, arrayBuf) {
  return new Promise((resolve, reject) => {
    const res = context.decodeAudioData(arrayBuf, resolve, reject);
    if (res && typeof res.then === 'function') {
      res.then(resolve).catch(reject);
    }
  });
}

function updateDiagStatus() {
  const diagEl = document.getElementById('diag');
  if (!diagEl) return;
  if (!isRunning) {
    diagEl.textContent = 'Audio pronto in RAM. Tocca AVVIA per partire.';
    return;
  }
  const baseLat = actx && actx.baseLatency ? (actx.baseLatency * 1000).toFixed(0) : '?';
  const outLat = actx && actx.outputLatency ? (actx.outputLatency * 1000).toFixed(0) : '?';
  const hzText = gpsHzDisplay > 0 ? `${gpsHzDisplay.toFixed(1)} Hz` : 'attesa';
  diagEl.textContent = `GPS: ${hzText} | Audio buffer: ${baseLat}ms (out: ${outLat}ms) | Gas virt: ${(filteredThrottle * 100).toFixed(0)}%`;
}

async function initAudioGraph() {
  if (!actx) {
    actx = createAudioContext();
  }
  if (actx.state === 'suspended') {
    await actx.resume();
  }

  // Se non ancora decodificati (caso limite)
  if (audioBuffers.length === 0) {
    const fetchPromises = sampleFiles.map(async file => {
      const res = await fetch(file);
      const arrayBuf = await res.arrayBuffer();
      return await decodeAudioCompat(actx, arrayBuf);
    });
    audioBuffers = await Promise.all(fetchPromises);
  }

  masterGain = actx.createGain();
  masterGain.gain.setValueAtTime(0.9, actx.currentTime);
  masterGain.connect(actx.destination);

  sourceNodes = [];
  gainNodes = [];

  audioBuffers.forEach(buf => {
    const src = actx.createBufferSource();
    src.buffer = buf;
    src.loop = true;

    const g = actx.createGain();
    // Imposta subito a 0 senza rampa differita
    g.gain.setValueAtTime(0, actx.currentTime);

    src.connect(g);
    g.connect(masterGain);

    sourceNodes.push(src);
    gainNodes.push(g);
    src.start();
  });

  // Applica subito i volumi per il minimo (800 RPM)
  updateAudio(currentRpm, filteredThrottle, true);
}

function updateAudio(rpm, load, immediate = false) {
  if (!actx || sourceNodes.length === 0) return;

  const t = actx.currentTime;
  // Rampa a 8ms: impercettibile all'orecchio umano (< 1 frame video a 60fps), elimina ogni sensazione di lag
  const ramp = immediate ? 0.001 : 0.008;

  let lowerIdx = 0;
  for (let i = 0; i < sampleRpmPoints.length - 1; i++) {
    if (rpm >= sampleRpmPoints[i]) lowerIdx = i;
  }
  const upperIdx = Math.min(sampleRpmPoints.length - 1, lowerIdx + 1);

  const lowerRpm = sampleRpmPoints[lowerIdx];
  const upperRpm = sampleRpmPoints[upperIdx];
  const span = Math.max(1, upperRpm - lowerRpm);
  const factor = Math.max(0, Math.min(1, (rpm - lowerRpm) / span));

  gainNodes.forEach((g, i) => {
    let target = 0;
    if (i === lowerIdx) target = 1 - factor;
    else if (i === upperIdx) target = factor;
    target = target * (0.6 + load * 0.4);
    g.gain.setTargetAtTime(target, t, ramp);

    const refRpm = sampleRpmPoints[i];
    const rate = Math.max(0.6, Math.min(1.8, rpm / refRpm));
    sourceNodes[i].playbackRate.setTargetAtTime(rate, t, ramp);
  });
}

let lastLoopTime = performance.now();
function updatePhysics(spd) {
  const now = performance.now();
  const dt = Math.min(0.1, (now - lastLoopTime) / 1000);
  lastLoopTime = now;

  if (spd < 1) {
    gear = 1;
    targetRpm = IDLE_RPM;
  } else {
    if (driveMode === 'ev') {
      // Curva EV continua
      const normalizedSpeed = Math.min(260, spd) / 230;
      targetRpm = IDLE_RPM + Math.pow(normalizedSpeed, 0.72) * 4200;
      targetRpm = Math.min(5800, targetRpm);
    } else {
      // Cambio ZF 8HP adattivo
      const wheelCircMeters = 2.05;
      const wheelRpm = (spd * 1000 / 60) / wheelCircMeters;
      const calcRpm = (g) => wheelRpm * ratios[g] * finalDrive;

      const upshiftRpm = 1850 + filteredThrottle * 3550;
      const downshiftRpm = 1150 + filteredThrottle * 2050;

      if ((now - lastShiftTime) >= 1200) {
        const currentRpmG = calcRpm(gear);
        if (currentRpmG > upshiftRpm && gear < 8) {
          if (calcRpm(gear + 1) >= 1100) {
            gear++;
            lastShiftTime = now;
          }
        } else if (currentRpmG < downshiftRpm && gear > 1) {
          if (filteredThrottle > 0.75 && gear > 2 && calcRpm(gear - 2) < (MAX_RPM - 800)) {
            gear -= 2;
          } else {
            gear--;
          }
          lastShiftTime = now;
        }
      }

      targetRpm = Math.max(IDLE_RPM, Math.min(MAX_RPM, calcRpm(gear)));
    }
  }

  // Inseguimento RPM reattivo: tau = 35ms (prima era 70ms). Al cambio marcia resta morbido, ma segue lo slider all'istante
  const rpmFollowFactor = 1 - Math.exp(-dt / 0.035);
  currentRpm += (targetRpm - currentRpm) * rpmFollowFactor;

  if (isRunning) {
    updateAudio(currentRpm, filteredThrottle);
  }

  // UI update
  document.getElementById('gear-badge').textContent = (spd < 1) ? 'P' : (driveMode === 'ev' ? 'D' : gear);
  document.getElementById('rpm-val').textContent = Math.round(currentRpm);
  document.getElementById('speed-num').textContent = Math.round(spd);
  document.getElementById('bar-fill').style.width = Math.min(100, (currentRpm / MAX_RPM) * 100) + '%';
  updateDiagStatus();
}

function loop() {
  updatePhysics(currentSpeed);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function startGps() {
  if (!('geolocation' in navigator)) {
    document.getElementById('gps-status').textContent = 'NO GPS';
    return;
  }
  geoWatchId = navigator.geolocation.watchPosition(
    pos => {
      const spdKmh = (pos.coords.speed || 0) * 3.6;
      registerSpeedUpdate(spdKmh);
      document.getElementById('gps-status').textContent = `GPS ATTIVO (±${Math.round(pos.coords.accuracy || 0)}m)`;
    },
    err => {
      document.getElementById('gps-status').textContent = 'ERRORE GPS';
    },
    { enableHighAccuracy: true, maximumAge: 500, timeout: 5000 }
  );
}

// Handler UI
const pBtn = document.getElementById('power-btn');
pBtn.addEventListener('click', async () => {
  if (!actx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    actx = new AC();
  }
  if (actx.state === 'suspended') {
    await actx.resume();
  }

  if (!isRunning) {
    pBtn.disabled = true;
    pBtn.textContent = 'AVVIO...';
    try {
      await initAudioGraph();
      startGps();
      isRunning = true;
      pBtn.textContent = 'SPEGNI MOTORE';
      pBtn.classList.add('stop');
      pBtn.disabled = false;
      document.getElementById('diag').textContent = 'Motore in esecuzione.';
    } catch (e) {
      pBtn.disabled = false;
      pBtn.textContent = 'AVVIA MOTORE';
      document.getElementById('diag').textContent = 'Errore: ' + e.message;
    }
  } else {
    sourceNodes.forEach(s => { try { s.stop(); } catch(e){} });
    sourceNodes = [];
    gainNodes = [];
    if (geoWatchId) navigator.geolocation.clearWatch(geoWatchId);
    isRunning = false;
    currentSpeed = 0;
    pBtn.textContent = 'AVVIA MOTORE';
    pBtn.classList.remove('stop');
    document.getElementById('diag').textContent = 'Motore spento.';
  }
});

// Switch modalità EV vs Cambio
const btnEv = document.getElementById('btn-ev-mode');
const btnGear = document.getElementById('btn-gear-mode');

btnEv.addEventListener('click', () => {
  driveMode = 'ev';
  btnEv.classList.add('active');
  btnGear.classList.remove('active');
});

btnGear.addEventListener('click', () => {
  driveMode = 'gears';
  btnGear.classList.add('active');
  btnEv.classList.remove('active');
});

// Slider test banco
const sSlider = document.getElementById('sim-slider');
sSlider.addEventListener('input', e => {
  const val = parseFloat(e.target.value);
  registerSpeedUpdate(val, true); // true = input diretto a zero latenza
  document.getElementById('sim-spd').textContent = `${Math.round(val)} km/h`;
});
</script>
</body>
</html>
