<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tesla Wrooom</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none}
body{
  background:#050507;
  color:#f5f5f7;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
  height:100vh;
  display:grid;
  grid-template-rows:auto 1fr auto;
  padding:28px 36px;
  overflow:hidden;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:16px;
  font-weight:600;
  letter-spacing:1px;
  color:#8e8e93;
}
.badge{
  background:#1c1c1e;
  padding:8px 16px;
  border-radius:20px;
  font-size:14px;
  color:#30d158;
}

/* Cluster centrale tipo cockpit Tesla */
.cluster{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:18px;
}
.speed-display{
  display:flex;
  align-items:baseline;
  gap:8px;
}
#speed-num{
  font-size:120px;
  font-weight:800;
  line-height:0.9;
  letter-spacing:-3px;
  font-variant-numeric:tabular-nums;
}
.speed-unit{
  font-size:28px;
  font-weight:600;
  color:#8e8e93;
}

.rpm-container{
  display:flex;
  align-items:center;
  gap:16px;
  font-size:22px;
  font-weight:600;
  color:#a1a1a6;
}
#rpm-val{
  font-size:32px;
  font-weight:700;
  color:#fff;
  font-variant-numeric:tabular-nums;
}
#gear-badge{
  background:#ff3b30;
  color:#fff;
  padding:4px 14px;
  border-radius:8px;
  font-weight:800;
  font-size:20px;
}

/* Barra tachimetro / giri stile Tesla Model 3 */
.bar-track{
  width:100%;
  max-width:720px;
  height:18px;
  background:#1c1c1e;
  border-radius:9px;
  overflow:hidden;
  box-shadow:inset 0 1px 3px rgba(0,0,0,0.8);
}
#bar-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#30d158 0%,#ffd60a 70%,#ff3b30 95%);
  transition:width .05s linear;
}

/* Pannello comandi grande per touch screen */
.dashboard-controls{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:16px;
  width:100%;
  max-width:720px;
  margin:0 auto;
}

/* Tasti modalità EV diretto vs Cambio simulato */
.mode-toggle{
  display:flex;
  width:100%;
  background:#1c1c1e;
  border-radius:14px;
  padding:4px;
  gap:4px;
}
.mode-opt{
  flex:1;
  padding:14px;
  border:0;
  background:transparent;
  color:#8e8e93;
  font-size:15px;
  font-weight:700;
  border-radius:10px;
  cursor:pointer;
  transition:all .15s ease;
}
.mode-opt.active{
  background:#2c2c2e;
  color:#fff;
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
}

/* Pulsantone Avvia/Spegni enorme touch-friendly */
.btn-power{
  width:100%;
  padding:22px;
  font-size:22px;
  font-weight:800;
  letter-spacing:1px;
  border:0;
  border-radius:16px;
  background:#ff3b30;
  color:#fff;
  cursor:pointer;
  box-shadow:0 6px 24px rgba(255,59,48,0.35);
  transition:transform .1s ease, background .15s ease;
}
.btn-power:active{
  transform:scale(0.98);
}
.btn-power.stop{
  background:#2c2c2e;
  box-shadow:none;
}
.btn-power:disabled{
  opacity:0.4;
  cursor:not-allowed;
}

/* Slider test banco */
.sim-box{
  width:100%;
  display:flex;
  align-items:center;
  gap:16px;
  font-size:14px;
  color:#8e8e93;
}
.sim-box input{
  flex:1;
  height:12px;
  accent-color:#ff3b30;
  cursor:pointer;
}

.status-line{
  font-size:12px;
  color:#636366;
  text-align:center;
}
</style>
</head>
<body>

<header>
  <div>TESLA WROOOM</div>
  <div class="badge" id="gps-status">GPS IN ATTESA</div>
</header>

<div class="cluster">
  <div class="speed-display">
    <div id="speed-num">0</div>
    <div class="speed-unit">km/h</div>
  </div>

  <div class="rpm-container">
    <span id="gear-badge">D</span>
    <span><span id="rpm-val">800</span> RPM</span>
  </div>

  <div class="bar-track">
    <div id="bar-fill"></div>
  </div>
</div>

<div class="dashboard-controls">
  <div class="mode-toggle">
    <button class="mode-opt active" id="btn-ev-mode">MONOMARCIA EV (NATIVO TESLA)</button>
    <button class="mode-opt" id="btn-gear-mode">CAMBIO VIRTUAL (1-6 MARCE)</button>
  </div>

  <button id="power-btn" class="btn-power" disabled>CARICAMENTO AUDIO...</button>

  <div class="sim-box">
    <span>TEST BANCO:</span>
    <input type="range" id="sim-slider" min="0" max="220" value="0">
    <span id="sim-spd" style="min-width:50px">0 km/h</span>
  </div>

  <div class="status-line" id="diag">Download campioni...</div>
</div>

<script>
// ponytail: supporto doppio (EV monomarcia continuo vs cambio virtuale) con UI grande per schermo Tesla
const IDLE_RPM = 800, MAX_RPM = 7500;
const ratios = [0, 3.4, 2.1, 1.45, 1.1, 0.85, 0.7];
const finalDrive = 3.9;

const sampleRpmPoints = [800, 1800, 2800, 4000, 5500, 7200];
const sampleFiles = [
  'sounds/loop_0.wav',
  'sounds/loop_1.wav',
  'sounds/loop_2.wav',
  'sounds/loop_3.wav',
  'sounds/loop_4.wav',
  'sounds/loop_5.wav'
];

let actx = null, isRunning = false;
let rawAudioArrayBuffers = [];
let audioBuffers = [];
let sourceNodes = [], gainNodes = [];
let masterGain = null;
let currentSpeed = 0, targetRpm = IDLE_RPM, currentRpm = IDLE_RPM;
let gear = 1, throttle = 0, lastSpeed = 0, lastThrottle = 0, lastTime = performance.now();
let driveMode = 'ev'; // 'ev' = marcia unica continua, 'gears' = cambio 1-6
let geoWatchId = null;

// Download arrayBuffer
async function preloadSamples() {
  try {
    const promises = sampleFiles.map(async file => {
      const res = await fetch(file);
      if (!res.ok) throw new Error(`HTTP ${res.status} per ${file}`);
      return await res.arrayBuffer();
    });
    rawAudioArrayBuffers = await Promise.all(promises);

    const btn = document.getElementById('power-btn');
    btn.disabled = false;
    btn.textContent = 'AVVIA MOTORE';
    document.getElementById('diag').textContent = 'Pronto. Tocca AVVIA per partire.';
  } catch (err) {
    document.getElementById('diag').textContent = 'Errore suoni: ' + err.message;
  }
}
preloadSamples();

function decodeAudioCompat(context, arrayBuf) {
  return new Promise((resolve, reject) => {
    const res = context.decodeAudioData(arrayBuf, resolve, reject);
    if (res && typeof res.then === 'function') {
      res.then(resolve).catch(reject);
    }
  });
}

async function initAudioGraph() {
  if (!actx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    actx = new AC();
  }
  if (actx.state === 'suspended') {
    await actx.resume();
  }

  if (audioBuffers.length === 0) {
    document.getElementById('diag').textContent = 'Decodifica audio in corso...';
    for (let i = 0; i < rawAudioArrayBuffers.length; i++) {
      const buf = await decodeAudioCompat(actx, rawAudioArrayBuffers[i].slice(0));
      audioBuffers.push(buf);
    }
  }

  masterGain = actx.createGain();
  masterGain.gain.setValueAtTime(0.9, actx.currentTime);
  masterGain.connect(actx.destination);

  sourceNodes = [];
  gainNodes = [];

  audioBuffers.forEach(buf => {
    const src = actx.createBufferSource();
    src.buffer = buf;
    src.loop = true;

    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, actx.currentTime);

    src.connect(g);
    g.connect(masterGain);

    sourceNodes.push(src);
    gainNodes.push(g);
    src.start();
  });

  updateAudio(currentRpm, throttle);
}

function updateAudio(rpm, load) {
  if (!actx || sourceNodes.length === 0) return;

  const t = actx.currentTime;
  const ramp = 0.05;

  let lowerIdx = 0;
  for (let i = 0; i < sampleRpmPoints.length - 1; i++) {
    if (rpm >= sampleRpmPoints[i]) lowerIdx = i;
  }
  const upperIdx = Math.min(sampleRpmPoints.length - 1, lowerIdx + 1);

  const lowerRpm = sampleRpmPoints[lowerIdx];
  const upperRpm = sampleRpmPoints[upperIdx];
  const span = Math.max(1, upperRpm - lowerRpm);
  const factor = Math.max(0, Math.min(1, (rpm - lowerRpm) / span));

  gainNodes.forEach((g, i) => {
    let target = 0;
    if (i === lowerIdx) target = 1 - factor;
    else if (i === upperIdx) target = factor;
    target = target * (0.6 + load * 0.4);
    g.gain.setTargetAtTime(target, t, ramp);

    const refRpm = sampleRpmPoints[i];
    const rate = Math.max(0.6, Math.min(1.8, rpm / refRpm));
    sourceNodes[i].playbackRate.setTargetAtTime(rate, t, ramp);
  });
}

function updatePhysics(spd) {
  if (spd < 1) {
    gear = 1;
    targetRpm = IDLE_RPM;
    throttle = 0;
  } else {
    if (driveMode === 'ev') {
      // Monomarcia EV: l'RPM sale linearmente con la velocita da 0 a 220 km/h (da 800 a 7500 RPM)
      const ratioEv = (spd / 200); // 200 km/h = limitatore
      targetRpm = IDLE_RPM + ratioEv * (MAX_RPM - IDLE_RPM);
      targetRpm = Math.min(MAX_RPM, targetRpm);
    } else {
      // Cambio termico simulato (1-6)
      if (spd < 25) gear = 1;
      else if (spd < 50) gear = 2;
      else if (spd < 85) gear = 3;
      else if (spd < 125) gear = 4;
      else if (spd < 165) gear = 5;
      else gear = 6;

      const wheelCircMeters = 2.05;
      const wheelRpm = (spd * 1000 / 60) / wheelCircMeters;
      targetRpm = Math.max(IDLE_RPM, Math.min(MAX_RPM, wheelRpm * ratios[gear] * finalDrive));
    }
  }

  const now = performance.now();
  const dt = (now - lastTime) / 1000;
  if (dt > 0.05) {
    const accel = (spd - lastSpeed) / dt;
    throttle = Math.max(0, Math.min(1, accel / 15));
    lastSpeed = spd;
    lastTime = now;
  }

  currentRpm += (targetRpm - currentRpm) * 0.15;

  if (isRunning) {
    updateAudio(currentRpm, throttle);
  }

  // UI update
  document.getElementById('gear-badge').textContent = (spd < 1) ? 'P' : (driveMode === 'ev' ? 'D' : gear);
  document.getElementById('rpm-val').textContent = Math.round(currentRpm);
  document.getElementById('speed-num').textContent = Math.round(spd);
  document.getElementById('bar-fill').style.width = Math.min(100, (currentRpm / MAX_RPM) * 100) + '%';
}

function loop() {
  updatePhysics(currentSpeed);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function startGps() {
  if (!('geolocation' in navigator)) {
    document.getElementById('gps-status').textContent = 'NO GPS';
    return;
  }
  geoWatchId = navigator.geolocation.watchPosition(
    pos => {
      const spdKmh = (pos.coords.speed || 0) * 3.6;
      currentSpeed = Math.max(0, spdKmh);
      document.getElementById('gps-status').textContent = `GPS ATTIVO (±${Math.round(pos.coords.accuracy || 0)}m)`;
    },
    err => {
      document.getElementById('gps-status').textContent = 'ERRORE GPS';
    },
    { enableHighAccuracy: true, maximumAge: 500, timeout: 5000 }
  );
}

// Handler UI
const pBtn = document.getElementById('power-btn');
pBtn.addEventListener('click', async () => {
  if (!actx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    actx = new AC();
  }
  if (actx.state === 'suspended') {
    await actx.resume();
  }

  if (!isRunning) {
    pBtn.disabled = true;
    pBtn.textContent = 'AVVIO...';
    try {
      await initAudioGraph();
      startGps();
      isRunning = true;
      pBtn.textContent = 'SPEGNI MOTORE';
      pBtn.classList.add('stop');
      pBtn.disabled = false;
      document.getElementById('diag').textContent = 'Motore in esecuzione.';
    } catch (e) {
      pBtn.disabled = false;
      pBtn.textContent = 'AVVIA MOTORE';
      document.getElementById('diag').textContent = 'Errore: ' + e.message;
    }
  } else {
    sourceNodes.forEach(s => { try { s.stop(); } catch(e){} });
    sourceNodes = [];
    gainNodes = [];
    if (geoWatchId) navigator.geolocation.clearWatch(geoWatchId);
    isRunning = false;
    currentSpeed = 0;
    pBtn.textContent = 'AVVIA MOTORE';
    pBtn.classList.remove('stop');
    document.getElementById('diag').textContent = 'Motore spento.';
  }
});

// Switch modalità EV vs Cambio
const btnEv = document.getElementById('btn-ev-mode');
const btnGear = document.getElementById('btn-gear-mode');

btnEv.addEventListener('click', () => {
  driveMode = 'ev';
  btnEv.classList.add('active');
  btnGear.classList.remove('active');
});

btnGear.addEventListener('click', () => {
  driveMode = 'gears';
  btnGear.classList.add('active');
  btnEv.classList.remove('active');
});

// Slider test banco
const sSlider = document.getElementById('sim-slider');
sSlider.addEventListener('input', e => {
  currentSpeed = parseFloat(e.target.value);
  document.getElementById('sim-spd').textContent = `${Math.round(currentSpeed)} km/h`;
});
</script>
</body>
</html>
