<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tesla Wrooom - V12</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none}
body{
  background:#050507;
  color:#f5f5f7;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
  height:100vh;
  display:grid;
  grid-template-rows:auto 1fr auto;
  padding:24px 32px;
  overflow:hidden;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:15px;
  font-weight:700;
  letter-spacing:1px;
  color:#8e8e93;
}
.badge{
  background:#1c1c1e;
  padding:6px 14px;
  border-radius:18px;
  font-size:13px;
  color:#30d158;
}

/* Cockpit Tesla */
.cluster{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:14px;
}
.speed-display{
  display:flex;
  align-items:baseline;
  gap:8px;
}
#speed-num{
  font-size:120px;
  font-weight:800;
  line-height:0.9;
  letter-spacing:-3px;
  font-variant-numeric:tabular-nums;
}
.speed-unit{
  font-size:26px;
  font-weight:600;
  color:#8e8e93;
}

.rpm-container{
  display:flex;
  align-items:center;
  gap:14px;
  font-size:22px;
  font-weight:700;
  color:#a1a1a6;
}
#rpm-val{
  font-size:36px;
  font-weight:800;
  color:#fff;
  font-variant-numeric:tabular-nums;
}
#gear-badge{
  background:#ff3b30;
  color:#fff;
  padding:3px 12px;
  border-radius:8px;
  font-weight:800;
  font-size:18px;
  letter-spacing:1px;
}

/* Barra contagiri tipo V12 (fino a 8500 RPM) */
.bar-track{
  width:100%;
  max-width:720px;
  height:16px;
  background:#1c1c1e;
  border-radius:8px;
  overflow:hidden;
  box-shadow:inset 0 1px 3px rgba(0,0,0,0.8);
}
#bar-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#30d158 0%,#ffd60a 65%,#ff3b30 88%);
  transition:width .04s linear;
}

/* Controlli */
.dashboard-controls{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:14px;
  width:100%;
  max-width:720px;
  margin:0 auto;
}

.btn-power{
  width:100%;
  padding:20px;
  font-size:22px;
  font-weight:800;
  letter-spacing:1.5px;
  border:0;
  border-radius:16px;
  background:#ff3b30;
  color:#fff;
  cursor:pointer;
  box-shadow:0 6px 24px rgba(255,59,48,0.35);
  transition:transform .1s ease, background .15s ease;
}
.btn-power:active{
  transform:scale(0.98);
}
.btn-power.stop{
  background:#2c2c2e;
  box-shadow:none;
}

/* Slider test banco */
.sim-box{
  width:100%;
  display:flex;
  align-items:center;
  gap:16px;
  font-size:14px;
  color:#8e8e93;
}
.sim-box input{
  flex:1;
  height:12px;
  accent-color:#ff3b30;
  cursor:pointer;
}

.status-line{
  font-size:12px;
  color:#636366;
  text-align:center;
}
.probe-link{
  color:#8e8e93;
  text-decoration:none;
  font-size:12px;
}
.probe-link:hover{
  color:#fff;
}
</style>
</head>
<body>

<header>
  <div>TESLA WROOOM</div>
  <div class="badge" id="gps-status">GPS IN ATTESA</div>
</header>

<div class="cluster">
  <div class="speed-display">
    <div id="speed-num">0</div>
    <div class="speed-unit">km/h</div>
  </div>

  <div class="rpm-container">
    <span id="gear-badge">P</span>
    <span><span id="rpm-val">900</span> RPM</span>
  </div>

  <div class="bar-track">
    <div id="bar-fill"></div>
  </div>
</div>

<div class="dashboard-controls">
  <button id="power-btn" class="btn-power">AVVIA MOTORE</button>

  <div class="sim-box">
    <span>TEST BANCO:</span>
    <input type="range" id="sim-slider" min="0" max="260" value="0">
    <span id="sim-spd" style="min-width:65px">0 km/h</span>
  </div>

  <div class="status-line" id="diag">Motore multi-strato 3 bande (OpenGameArt CC0) • Idle/Mid/High</div>
  <a href="probe.html" class="probe-link">Apri Test Sensori Tesla (probe.html)</a>
</div>

<script src="sounds/samples.js"></script>
<script>
// ponytail: Motore campionato V12 (LaFerrari/Defender/Chevy) via Web Audio API
const IDLE_RPM = 900, MAX_RPM = 8500;

let actx = null, isRunning = false;
let currentSpeed = 0, targetRpm = IDLE_RPM, currentRpm = IDLE_RPM;
let filteredThrottle = 0;
let lastSpeedSample = 0, lastSpeedSampleTime = performance.now();
let geoWatchId = null;

let gpsSampleCount = 0;
let lastGpsSampleTimestamp = 0;
let gpsHzDisplay = 0;

// Motore audio a 3 bande campionate reali (Idle, Mid, High RPM)
let masterGain = null;
let idleNode = null, idleGain = null;
let midNode = null, midGain = null;
let highNode = null, highGain = null;
let audioBuffers = {};

function base64ToArrayBuffer(base64) {
  const binaryString = atob(base64.replace(/^data:audio\/\w+;base64,/, ''));
  const len = binaryString.length;
  const bytes = new Uint8Array(len);
  for (let i = 0; i < len; i++) {
    bytes[i] = binaryString.charCodeAt(i);
  }
  return bytes.buffer;
}

function decodeAudioDataSafe(ctx, arrayBuffer) {
  return new Promise((resolve, reject) => {
    // Gestione ibrida sia callback legacy (WebKit/Safari) che promise standard (Chromium)
    const res = ctx.decodeAudioData(
      arrayBuffer,
      buf => resolve(buf),
      err => reject(err || new Error('decodeAudioData failed'))
    );
    if (res && typeof res.then === 'function') {
      res.then(resolve).catch(reject);
    }
  });
}

async function loadSampleBuffer(ctx, base64Data) {
  const ab = base64ToArrayBuffer(base64Data);
  return await decodeAudioDataSafe(ctx, ab);
}

async function initAudioEngine() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) throw new Error('Web Audio non supportato');
  
  const ctx = new AC({ latencyHint: 'interactive' });
  if (ctx.state === 'suspended') {
    await ctx.resume();
  }

  // Caricamento parallelo dai dati base64 sincroni (zero fetch di rete)
  const [bIdle, bMid, bHigh] = await Promise.all([
    loadSampleBuffer(ctx, ENGINE_SAMPLES.idle),
    loadSampleBuffer(ctx, ENGINE_SAMPLES.mid),
    loadSampleBuffer(ctx, ENGINE_SAMPLES.high)
  ]);
  audioBuffers.idle = bIdle;
  audioBuffers.mid = bMid;
  audioBuffers.high = bHigh;

  masterGain = ctx.createGain();
  masterGain.gain.setValueAtTime(0.9, ctx.currentTime);
  masterGain.connect(ctx.destination);

  // 1. Idle
  idleGain = ctx.createGain();
  idleGain.gain.setValueAtTime(1.0, ctx.currentTime);
  idleGain.connect(masterGain);
  idleNode = ctx.createBufferSource();
  idleNode.buffer = audioBuffers.idle;
  idleNode.loop = true;
  idleNode.playbackRate.setValueAtTime(1.0, ctx.currentTime);
  idleNode.connect(idleGain);
  idleNode.start();

  // 2. Mid
  midGain = ctx.createGain();
  midGain.gain.setValueAtTime(0.0, ctx.currentTime);
  midGain.connect(masterGain);
  midNode = ctx.createBufferSource();
  midNode.buffer = audioBuffers.mid;
  midNode.loop = true;
  midNode.playbackRate.setValueAtTime(1.0, ctx.currentTime);
  midNode.connect(midGain);
  midNode.start();

  // 3. High
  highGain = ctx.createGain();
  highGain.gain.setValueAtTime(0.0, ctx.currentTime);
  highGain.connect(masterGain);
  highNode = ctx.createBufferSource();
  highNode.buffer = audioBuffers.high;
  highNode.loop = true;
  highNode.playbackRate.setValueAtTime(1.0, ctx.currentTime);
  highNode.connect(highGain);
  highNode.start();

  actx = ctx;
  updateAudioEngine(currentRpm, filteredThrottle, true);
}

function updateAudioEngine(rpm, load, immediate = false) {
  if (!actx || !idleNode || !midNode || !highNode) return;

  const t = actx.currentTime;
  const ramp = immediate ? 0.005 : 0.025;

  // Calcolo pitch-shift naturale limitato per ciascun campione
  // Evita l'effetto chipmunk o artefatti di campionamento estremo
  const idleRate = Math.max(0.7, Math.min(2.0, rpm / 900));
  const midRate  = Math.max(0.6, Math.min(1.8, rpm / 3200));
  const highRate = Math.max(0.7, Math.min(1.7, rpm / 5800));

  idleNode.playbackRate.setTargetAtTime(idleRate, t, ramp);
  midNode.playbackRate.setTargetAtTime(midRate, t, ramp);
  highNode.playbackRate.setTargetAtTime(highRate, t, ramp);

  // Crossfade a 3 strati continuo in base a RPM e carico acceleratore
  // Aggiunge un boost di presenza armonica quando l'acceleratore e premuto
  let wIdle = 0, wMid = 0, wHigh = 0;

  if (rpm < 2200) {
    const f = (rpm - 900) / (2200 - 900);
    wIdle = 1 - f;
    wMid = f;
  } else if (rpm < 5200) {
    const f = (rpm - 2200) / (5200 - 2200);
    wMid = 1 - f;
    wHigh = f;
  } else {
    wHigh = 1.0;
  }

  // Bonus volume su mid e high quando il gas e pigiato
  const loadBoost = 1.0 + Math.max(0, Math.min(1, load)) * 0.35;

  idleGain.gain.setTargetAtTime(Math.max(0, wIdle) * 0.95, t, ramp);
  midGain.gain.setTargetAtTime(Math.max(0, wMid) * 1.05 * loadBoost, t, ramp);
  highGain.gain.setTargetAtTime(Math.max(0, wHigh) * 1.15 * loadBoost, t, ramp);
}

function registerSpeedUpdate(spd, isDirectInput = false) {
  const now = performance.now();
  const dt = (now - lastSpeedSampleTime) / 1000;

  if (isDirectInput) {
    if (dt > 0.01) {
      const rawAccel = (spd - lastSpeedSample) / dt;
      const rawThrottle = Math.max(0, Math.min(1, rawAccel / 15));
      filteredThrottle += (rawThrottle - filteredThrottle) * 0.45;
      lastSpeedSample = spd;
      lastSpeedSampleTime = now;
    }
  } else {
    gpsSampleCount++;
    if (lastGpsSampleTimestamp > 0 && dt > 0) {
      const instantHz = 1 / dt;
      gpsHzDisplay = gpsHzDisplay === 0 ? instantHz : (gpsHzDisplay * 0.8 + instantHz * 0.2);
    }
    lastGpsSampleTimestamp = now;

    if (dt > 0.04) {
      const rawAccel = (spd - lastSpeedSample) / dt;
      const rawThrottle = Math.max(0, Math.min(1, rawAccel / 12));
      const alpha = rawThrottle > filteredThrottle ? 0.45 : 0.15;
      filteredThrottle += (rawThrottle - filteredThrottle) * alpha;
      lastSpeedSample = spd;
      lastSpeedSampleTime = now;
    }
  }
  currentSpeed = Math.max(0, spd);
}

function updateDiagStatus() {
  const diagEl = document.getElementById('diag');
  if (!diagEl) return;
  if (!isRunning) {
    diagEl.textContent = 'Motore multi-strato 3 bande (OpenGameArt CC0) • Idle/Mid/High';
    return;
  }
  const baseLat = actx && actx.baseLatency ? (actx.baseLatency * 1000).toFixed(0) : '?';
  const outLat = actx && actx.outputLatency ? (actx.outputLatency * 1000).toFixed(0) : '?';
  const hzText = gpsHzDisplay > 0 ? `${gpsHzDisplay.toFixed(1)} Hz` : 'attesa';
  diagEl.textContent = `GPS: ${hzText} | Audio buffer: ${baseLat}ms (out: ${outLat}ms) | Gas: ${(filteredThrottle * 100).toFixed(0)}%`;
}

let lastLoopTime = performance.now();
function updatePhysics(spd) {
  const now = performance.now();
  const dt = Math.min(0.1, (now - lastLoopTime) / 1000);
  lastLoopTime = now;

  if (spd < 1) {
    targetRpm = IDLE_RPM;
  } else {
    // V12 Range dinamico fino a 8500 RPM:
    // Crociera (gas sfiorato o zero):
    // 50 km/h: ~1350 RPM
    // 90 km/h: ~1700 RPM
    // 130 km/h: ~2100 RPM
    // Pieno carico (affondo gas): sale istantaneamente verso i 6500-8500 RPM
    const cruiseRpm = IDLE_RPM + (spd / 240) * 1600;
    const accelBonus = filteredThrottle * (2500 + (spd / 200) * 3500);
    targetRpm = Math.max(IDLE_RPM, Math.min(MAX_RPM, cruiseRpm + accelBonus));
  }

  // Risposta giri agile e reattiva
  const rpmFollowFactor = 1 - Math.exp(-dt / 0.038);
  currentRpm += (targetRpm - currentRpm) * rpmFollowFactor;

  if (isRunning) {
    updateAudioEngine(currentRpm, filteredThrottle);
  }

  document.getElementById('gear-badge').textContent = (spd < 1) ? 'P' : 'D';
  document.getElementById('rpm-val').textContent = Math.round(currentRpm);
  document.getElementById('speed-num').textContent = Math.round(spd);
  document.getElementById('bar-fill').style.width = Math.min(100, (currentRpm / MAX_RPM) * 100) + '%';
  updateDiagStatus();
}

function loop() {
  updatePhysics(currentSpeed);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function startGps() {
  if (!('geolocation' in navigator)) {
    document.getElementById('gps-status').textContent = 'NO GPS';
    return;
  }
  geoWatchId = navigator.geolocation.watchPosition(
    pos => {
      const spdKmh = (pos.coords.speed || 0) * 3.6;
      registerSpeedUpdate(spdKmh);
      document.getElementById('gps-status').textContent = `GPS ATTIVO (±${Math.round(pos.coords.accuracy || 0)}m)`;
    },
    err => {
      document.getElementById('gps-status').textContent = 'ERRORE GPS';
    },
    { enableHighAccuracy: true, maximumAge: 500, timeout: 5000 }
  );
}

const pBtn = document.getElementById('power-btn');
pBtn.addEventListener('click', async () => {
  try {
    if (!actx) {
      pBtn.textContent = 'CARICAMENTO...';
      await initAudioEngine();
    }
    if (actx && actx.state === 'suspended') {
      await actx.resume();
    }

    if (!isRunning) {
      startGps();
      isRunning = true;
      pBtn.textContent = 'SPEGNI MOTORE';
      pBtn.classList.add('stop');
      document.getElementById('diag').textContent = 'Motore in esecuzione.';
    } else {
      if (geoWatchId) navigator.geolocation.clearWatch(geoWatchId);
      isRunning = false;
      currentSpeed = 0;
      pBtn.textContent = 'AVVIA MOTORE';
      pBtn.classList.remove('stop');
      document.getElementById('diag').textContent = 'Motore spento.';
      if (actx) actx.suspend();
    }
  } catch (err) {
    pBtn.textContent = 'AVVIA MOTORE';
    pBtn.classList.remove('stop');
    document.getElementById('diag').textContent = `ERRORE AUDIO: ${err.message || err}`;
  }
});

const sSlider = document.getElementById('sim-slider');
sSlider.addEventListener('input', e => {
  const val = parseFloat(e.target.value);
  registerSpeedUpdate(val, true);
  document.getElementById('sim-spd').textContent = `${Math.round(val)} km/h`;
});
</script>
</body>
</html>
