<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tesla Wrooom - V12</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none}
body{
  background:#050507;
  color:#f5f5f7;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
  height:100vh;
  display:grid;
  grid-template-rows:auto 1fr auto;
  padding:24px 32px;
  overflow:hidden;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:15px;
  font-weight:700;
  letter-spacing:1px;
  color:#8e8e93;
}
.badge{
  background:#1c1c1e;
  padding:6px 14px;
  border-radius:18px;
  font-size:13px;
  color:#30d158;
}

/* Cockpit Tesla */
.cluster{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:14px;
}
.speed-display{
  display:flex;
  align-items:baseline;
  gap:8px;
}
#speed-num{
  font-size:120px;
  font-weight:800;
  line-height:0.9;
  letter-spacing:-3px;
  font-variant-numeric:tabular-nums;
}
.speed-unit{
  font-size:26px;
  font-weight:600;
  color:#8e8e93;
}

.rpm-container{
  display:flex;
  align-items:center;
  gap:14px;
  font-size:22px;
  font-weight:700;
  color:#a1a1a6;
}
#rpm-val{
  font-size:36px;
  font-weight:800;
  color:#fff;
  font-variant-numeric:tabular-nums;
}
#gear-badge{
  background:#ff3b30;
  color:#fff;
  padding:3px 12px;
  border-radius:8px;
  font-weight:800;
  font-size:18px;
  letter-spacing:1px;
}

/* Barra contagiri tipo V12 (fino a 8500 RPM) */
.bar-track{
  width:100%;
  max-width:720px;
  height:16px;
  background:#1c1c1e;
  border-radius:8px;
  overflow:hidden;
  box-shadow:inset 0 1px 3px rgba(0,0,0,0.8);
}
#bar-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#30d158 0%,#ffd60a 65%,#ff3b30 88%);
  transition:width .04s linear;
}

/* Controlli */
.dashboard-controls{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:14px;
  width:100%;
  max-width:720px;
  margin:0 auto;
}

.btn-power{
  width:100%;
  padding:20px;
  font-size:22px;
  font-weight:800;
  letter-spacing:1.5px;
  border:0;
  border-radius:16px;
  background:#ff3b30;
  color:#fff;
  cursor:pointer;
  box-shadow:0 6px 24px rgba(255,59,48,0.35);
  transition:transform .1s ease, background .15s ease;
}
.btn-power:active{
  transform:scale(0.98);
}
.btn-power.stop{
  background:#2c2c2e;
  box-shadow:none;
}

/* Slider test banco */
.sim-box{
  width:100%;
  display:flex;
  align-items:center;
  gap:16px;
  font-size:14px;
  color:#8e8e93;
}
.sim-box input{
  flex:1;
  height:12px;
  accent-color:#ff3b30;
  cursor:pointer;
}

.status-line{
  font-size:12px;
  color:#636366;
  text-align:center;
}
.probe-link{
  color:#8e8e93;
  text-decoration:none;
  font-size:12px;
}
.probe-link:hover{
  color:#fff;
}
</style>
</head>
<body>

<header>
  <div>TESLA WROOOM • V12 ITALIANO</div>
  <div class="badge" id="gps-status">GPS IN ATTESA</div>
</header>

<div class="cluster">
  <div class="speed-display">
    <div id="speed-num">0</div>
    <div class="speed-unit">km/h</div>
  </div>

  <div class="rpm-container">
    <span id="gear-badge">P</span>
    <span><span id="rpm-val">900</span> RPM</span>
  </div>

  <div class="bar-track">
    <div id="bar-fill"></div>
  </div>
</div>

<div class="dashboard-controls">
  <button id="power-btn" class="btn-power">AVVIA V12</button>

  <div class="sim-box">
    <span>TEST BANCO:</span>
    <input type="range" id="sim-slider" min="0" max="260" value="0">
    <span id="sim-spd" style="min-width:65px">0 km/h</span>
  </div>

  <div class="status-line" id="diag">Zero file audio • Sintesi procedurale V12 in tempo reale</div>
  <a href="probe.html" class="probe-link">Apri Test Sensori Tesla (probe.html)</a>
</div>

<script>
// ponytail: Motore procedurale V12 italiano (6 accensioni/giro, zero WAV, zero attesa caricamento)
const IDLE_RPM = 900, MAX_RPM = 8500;

let actx = null, isRunning = false;
let currentSpeed = 0, targetRpm = IDLE_RPM, currentRpm = IDLE_RPM;
let filteredThrottle = 0;
let lastSpeedSample = 0, lastSpeedSampleTime = performance.now();
let geoWatchId = null;

let gpsSampleCount = 0;
let lastGpsSampleTimestamp = 0;
let gpsHzDisplay = 0;

// Nodi audio sintetizzatore V12
let masterGain = null;
let distNode = null;
let lowpassFilter = null;
let oscNodes = []; // { osc, gain, harmonic, baseGain }
let intakeNoiseNode = null;
let intakeFilter = null;
let intakeGain = null;

function createDistortionCurve(k = 8) {
  // Curva di saturazione a stato solido / scarico sportivo
  const n = 1024;
  const curve = new Float32Array(n);
  const deg = Math.PI / 180;
  for (let i = 0; i < n; i++) {
    const x = (i * 2) / n - 1;
    curve[i] = ((3 + k) * x * 20 * deg) / (Math.PI + k * Math.abs(x));
  }
  return curve;
}

function buildWhiteNoiseBuffer(ctx) {
  const bufferSize = ctx.sampleRate * 2; // 2 secondi in loop
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = Math.random() * 2 - 1;
  }
  return buffer;
}

function initSynth() {
  const AC = window.AudioContext || window.webkitAudioContext;
  actx = new AC({ latencyHint: 'interactive' });

  masterGain = actx.createGain();
  masterGain.gain.setValueAtTime(0.75, actx.currentTime);

  // Distorsione scarico
  distNode = actx.createWaveShaper();
  distNode.curve = createDistortionCurve(10);
  distNode.oversample = 'none'; // massime performance MCU2

  // Filtro principale scarico (apre con gli RPM)
  lowpassFilter = actx.createBiquadFilter();
  lowpassFilter.type = 'lowpass';
  lowpassFilter.frequency.setValueAtTime(2500, actx.currentTime);
  lowpassFilter.Q.setValueAtTime(1.5, actx.currentTime);

  distNode.connect(lowpassFilter);
  lowpassFilter.connect(masterGain);
  masterGain.connect(actx.destination);

  // Armoniche tipiche V12 aspirato (frequenza base f0 = RPM/60)
  // Per un 4 tempi a 12 cilindri, l'ordine dominante e' l'ordine 6 (6 scoppi per giro motore),
  // seguito dai suoi multipli (12, 18, 24) e da ordini meccanici (1, 2, 3, 4).
  const harmonicProfile = [
    { order: 1.0,  type: 'sawtooth', baseVol: 0.12, loadBonus: 0.05 },
    { order: 2.0,  type: 'triangle', baseVol: 0.15, loadBonus: 0.05 },
    { order: 3.0,  type: 'sawtooth', baseVol: 0.20, loadBonus: 0.10 },
    { order: 6.0,  type: 'sawtooth', baseVol: 0.65, loadBonus: 0.50 }, // Armonica principale V12
    { order: 12.0, type: 'sawtooth', baseVol: 0.35, loadBonus: 0.40 }, // Urlo ad alti regimi
    { order: 18.0, type: 'triangle', baseVol: 0.15, loadBonus: 0.25 },
    { order: 24.0, type: 'sine',     baseVol: 0.08, loadBonus: 0.20 }
  ];

  oscNodes = harmonicProfile.map(spec => {
    const osc = actx.createOscillator();
    osc.type = spec.type;
    const g = actx.createGain();
    g.gain.setValueAtTime(spec.baseVol * 0.1, actx.currentTime);

    osc.connect(g);
    g.connect(distNode);
    osc.start();
    return { osc, gain: g, spec };
  });

  // Sintesi rumore aspirazione (Air intake hiss & growl)
  const noiseBuf = buildWhiteNoiseBuffer(actx);
  intakeNoiseNode = actx.createBufferSource();
  intakeNoiseNode.buffer = noiseBuf;
  intakeNoiseNode.loop = true;

  intakeFilter = actx.createBiquadFilter();
  intakeFilter.type = 'bandpass';
  intakeFilter.frequency.setValueAtTime(450, actx.currentTime);
  intakeFilter.Q.setValueAtTime(3.0, actx.currentTime);

  intakeGain = actx.createGain();
  intakeGain.gain.setValueAtTime(0.001, actx.currentTime);

  intakeNoiseNode.connect(intakeFilter);
  intakeFilter.connect(intakeGain);
  intakeGain.connect(masterGain);
  intakeNoiseNode.start();

  updateSynthAudio(currentRpm, filteredThrottle, true);
}

function updateSynthAudio(rpm, load, immediate = false) {
  if (!actx || oscNodes.length === 0) return;

  const t = actx.currentTime;
  const ramp = immediate ? 0.002 : 0.012;

  // Frequenza di rotazione motore: f0 = RPM / 60
  const f0 = rpm / 60;

  // Aggiorna frequenze e ampiezze di ciascuna armonica del V12
  oscNodes.forEach(({ osc, gain, spec }) => {
    const targetFreq = Math.max(20, Math.min(18000, f0 * spec.order));
    osc.frequency.setTargetAtTime(targetFreq, t, ramp);

    // Con il carico aumentano le armoniche alte e l'aggressivita del timbro
    const vol = (spec.baseVol + spec.loadBonus * load) * (0.35 + (rpm / MAX_RPM) * 0.65);
    gain.gain.setTargetAtTime(vol, t, ramp);
  });

  // Filtro scarico: a 900 RPM taglia a ~1000Hz (cupo al minimo), a 8500 RPM apre a ~8000Hz (urlo V12)
  const cutoff = 900 + (rpm / MAX_RPM) * 7200 + (load * 1200);
  lowpassFilter.frequency.setTargetAtTime(Math.min(14000, cutoff), t, ramp);

  // Rumore aspirazione: sale proporzionalmente a carico del gas e giri
  const intakeFreq = 350 + (rpm / MAX_RPM) * 1200;
  intakeFilter.frequency.setTargetAtTime(intakeFreq, t, ramp);
  const intakeVol = (0.01 + load * 0.22) * (0.4 + (rpm / MAX_RPM) * 0.6);
  intakeGain.gain.setTargetAtTime(intakeVol, t, ramp);
}

function registerSpeedUpdate(spd, isDirectInput = false) {
  const now = performance.now();
  const dt = (now - lastSpeedSampleTime) / 1000;

  if (isDirectInput) {
    if (dt > 0.01) {
      const rawAccel = (spd - lastSpeedSample) / dt;
      const rawThrottle = Math.max(0, Math.min(1, rawAccel / 15));
      filteredThrottle += (rawThrottle - filteredThrottle) * 0.45;
      lastSpeedSample = spd;
      lastSpeedSampleTime = now;
    }
  } else {
    gpsSampleCount++;
    if (lastGpsSampleTimestamp > 0 && dt > 0) {
      const instantHz = 1 / dt;
      gpsHzDisplay = gpsHzDisplay === 0 ? instantHz : (gpsHzDisplay * 0.8 + instantHz * 0.2);
    }
    lastGpsSampleTimestamp = now;

    if (dt > 0.04) {
      const rawAccel = (spd - lastSpeedSample) / dt;
      const rawThrottle = Math.max(0, Math.min(1, rawAccel / 12));
      const alpha = rawThrottle > filteredThrottle ? 0.45 : 0.15;
      filteredThrottle += (rawThrottle - filteredThrottle) * alpha;
      lastSpeedSample = spd;
      lastSpeedSampleTime = now;
    }
  }
  currentSpeed = Math.max(0, spd);
}

function updateDiagStatus() {
  const diagEl = document.getElementById('diag');
  if (!diagEl) return;
  if (!isRunning) {
    diagEl.textContent = 'Zero file audio • Sintesi procedurale V12 in tempo reale';
    return;
  }
  const baseLat = actx && actx.baseLatency ? (actx.baseLatency * 1000).toFixed(0) : '?';
  const outLat = actx && actx.outputLatency ? (actx.outputLatency * 1000).toFixed(0) : '?';
  const hzText = gpsHzDisplay > 0 ? `${gpsHzDisplay.toFixed(1)} Hz` : 'attesa';
  diagEl.textContent = `GPS: ${hzText} | Audio buffer: ${baseLat}ms (out: ${outLat}ms) | Gas: ${(filteredThrottle * 100).toFixed(0)}%`;
}

let lastLoopTime = performance.now();
function updatePhysics(spd) {
  const now = performance.now();
  const dt = Math.min(0.1, (now - lastLoopTime) / 1000);
  lastLoopTime = now;

  if (spd < 1) {
    targetRpm = IDLE_RPM;
  } else {
    // V12 Range dinamico fino a 8500 RPM:
    // Crociera (gas sfiorato o zero):
    // 50 km/h: ~1350 RPM
    // 90 km/h: ~1700 RPM
    // 130 km/h: ~2100 RPM
    // Pieno carico (affondo gas): sale istantaneamente verso i 6500-8500 RPM
    const cruiseRpm = IDLE_RPM + (spd / 240) * 1600;
    const accelBonus = filteredThrottle * (2500 + (spd / 200) * 3500);
    targetRpm = Math.max(IDLE_RPM, Math.min(MAX_RPM, cruiseRpm + accelBonus));
  }

  // Risposta giri agile e reattiva
  const rpmFollowFactor = 1 - Math.exp(-dt / 0.038);
  currentRpm += (targetRpm - currentRpm) * rpmFollowFactor;

  if (isRunning) {
    updateSynthAudio(currentRpm, filteredThrottle);
  }

  document.getElementById('gear-badge').textContent = (spd < 1) ? 'P' : 'D';
  document.getElementById('rpm-val').textContent = Math.round(currentRpm);
  document.getElementById('speed-num').textContent = Math.round(spd);
  document.getElementById('bar-fill').style.width = Math.min(100, (currentRpm / MAX_RPM) * 100) + '%';
  updateDiagStatus();
}

function loop() {
  updatePhysics(currentSpeed);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function startGps() {
  if (!('geolocation' in navigator)) {
    document.getElementById('gps-status').textContent = 'NO GPS';
    return;
  }
  geoWatchId = navigator.geolocation.watchPosition(
    pos => {
      const spdKmh = (pos.coords.speed || 0) * 3.6;
      registerSpeedUpdate(spdKmh);
      document.getElementById('gps-status').textContent = `GPS ATTIVO (±${Math.round(pos.coords.accuracy || 0)}m)`;
    },
    err => {
      document.getElementById('gps-status').textContent = 'ERRORE GPS';
    },
    { enableHighAccuracy: true, maximumAge: 500, timeout: 5000 }
  );
}

const pBtn = document.getElementById('power-btn');
pBtn.addEventListener('click', async () => {
  if (!actx) {
    initSynth();
  }
  if (actx.state === 'suspended') {
    await actx.resume();
  }

  if (!isRunning) {
    startGps();
    isRunning = true;
    pBtn.textContent = 'SPEGNI V12';
    pBtn.classList.add('stop');
    document.getElementById('diag').textContent = 'V12 in esecuzione.';
  } else {
    if (geoWatchId) navigator.geolocation.clearWatch(geoWatchId);
    isRunning = false;
    currentSpeed = 0;
    pBtn.textContent = 'AVVIA V12';
    pBtn.classList.remove('stop');
    document.getElementById('diag').textContent = 'V12 spento.';
    if (actx) actx.suspend();
  }
});

const sSlider = document.getElementById('sim-slider');
sSlider.addEventListener('input', e => {
  const val = parseFloat(e.target.value);
  registerSpeedUpdate(val, true);
  document.getElementById('sim-spd').textContent = `${Math.round(val)} km/h`;
});
</script>
</body>
</html>
