<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Tesla Wrooom</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none}
body{background:#0a0a0c;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:24px;overflow:hidden}
header{display:flex;justify-content:space-between;width:100%;max-width:600px;font-size:14px;color:#888}
#gear{font-size:96px;font-weight:900;line-height:1;color:#ff3b30;text-shadow:0 0 20px rgba(255,59,48,.4)}
#rpm-val{font-size:48px;font-weight:700;font-variant-numeric:tabular-nums}
#speed-val{font-size:24px;color:#888}
.dial{display:flex;flex-direction:column;align-items:center;gap:8px}
.bar{width:100%;max-width:500px;height:14px;background:#222;border-radius:7px;overflow:hidden}
#bar-fill{height:100%;width:0;background:linear-gradient(90deg,#30d158,#ffd60a,#ff3b30);transition:width .05s linear}
.controls{width:100%;max-width:500px;display:flex;flex-direction:column;gap:16px}
.btn{background:#ff3b30;color:#fff;border:0;padding:16px;border-radius:12px;font-size:18px;font-weight:700;cursor:pointer;width:100%}
.btn:active{opacity:.8}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.stop{background:#333}
.sim{display:flex;flex-direction:column;gap:6px;font-size:12px;color:#aaa}
.sim input{width:100%;accent-color:#ff3b30}
.status{font-size:11px;color:#666;text-align:center}
</style>
</head>
<body>

<header>
  <span>TESLA WROOOM</span>
  <span id="gps-status">GPS: in attesa</span>
</header>

<div class="dial">
  <div id="gear">P</div>
  <div id="rpm-val">0 <span style="font-size:20px;color:#666">RPM</span></div>
  <div id="speed-val"><span id="speed-num">0</span> km/h</div>
  <div class="bar"><div id="bar-fill"></div></div>
</div>

<div class="controls">
  <button id="power-btn" class="btn" disabled>CARICAMENTO AUDIO...</button>

  <div class="sim">
    <label>Simulatore velocita: <span id="sim-spd">0</span> km/h</label>
    <input type="range" id="sim-slider" min="0" max="220" value="0">
  </div>

  <div class="status" id="diag">Download campioni audio in corso...</div>
</div>

<script>
// ponytail: campioni OpenGameArt domasx2 CC0 con crossfade + modulatore 5 cilindri + exhaust pops.
const IDLE_RPM = 800, MAX_RPM = 7500;
const ratios = [0, 3.4, 2.1, 1.45, 1.1, 0.85, 0.7];
const finalDrive = 3.9;

// 6 campioni mappati su RPM crescenti
const sampleRpmPoints = [800, 1800, 2800, 4000, 5500, 7200];
const sampleFiles = [
  'sounds/loop_0.wav',
  'sounds/loop_1.wav',
  'sounds/loop_2.wav',
  'sounds/loop_3.wav',
  'sounds/loop_4.wav',
  'sounds/loop_5.wav'
];

let actx = null, isRunning = false;
let audioBuffers = [];
let sourceNodes = [], gainNodes = [];
let masterGain, warbleGain, warbleOsc, popFilter;
let currentSpeed = 0, targetRpm = IDLE_RPM, currentRpm = IDLE_RPM;
let gear = 1, throttle = 0, lastSpeed = 0, lastThrottle = 0, lastTime = performance.now();
let geoWatchId = null;

// Precarica i 6 loop WAV
async function preloadSamples() {
  const AC = window.AudioContext || window.webkitAudioContext;
  actx = new AC();

  try {
    const promises = sampleFiles.map(async (file) => {
      const res = await fetch(file);
      const arr = await res.arrayBuffer();
      return await actx.decodeAudioData(arr);
    });
    audioBuffers = await Promise.all(promises);

    const btn = document.getElementById('power-btn');
    btn.disabled = false;
    btn.textContent = 'AVVIA MOTORE';
    document.getElementById('diag').textContent = 'Campioni caricati. Premi AVVIA.';
  } catch (err) {
    document.getElementById('diag').textContent = 'Errore fetch campioni: ' + err.message;
  }
}
preloadSamples();

function initAudioGraph() {
  masterGain = actx.createGain();
  masterGain.gain.value = 0.8;

  // Modulatore AM a 5 impulsi per ciclo (timbro 5 cilindri / RS)
  warbleGain = actx.createGain();
  warbleGain.gain.value = 0.85; // modulazione leggera

  warbleOsc = actx.createOscillator();
  warbleOsc.type = 'sawtooth';
  const warbleDepth = actx.createGain();
  warbleDepth.gain.value = 0.15; // 15% di ampiezza
  warbleOsc.connect(warbleDepth);
  warbleDepth.connect(warbleGain.gain);
  warbleOsc.start();

  // Istanzia 6 sorgenti in loop continuo, mixate via GainNode
  sourceNodes = [];
  gainNodes = [];

  audioBuffers.forEach((buf, i) => {
    const src = actx.createBufferSource();
    src.buffer = buf;
    src.loop = true;

    const g = actx.createGain();
    g.gain.value = (i === 0) ? 1.0 : 0.0;

    src.connect(g);
    g.connect(warbleGain);

    sourceNodes.push(src);
    gainNodes.push(g);
    src.start();
  });

  warbleGain.connect(masterGain);
  masterGain.connect(actx.destination);
}

// Scoppiettii di scarico al rilascio (pops & bangs)
function triggerPop() {
  if (!actx || !isRunning) return;
  const count = 1 + Math.floor(Math.random() * 3);
  for (let i = 0; i < count; i++) {
    const delay = i * 0.08 + Math.random() * 0.05;
    setTimeout(() => {
      if (!actx) return;
      const t = actx.currentTime;
      const bSize = actx.sampleRate * 0.04;
      const b = actx.createBuffer(1, bSize, actx.sampleRate);
      const data = b.getChannelData(0);
      for (let j = 0; j < bSize; j++) data[j] = (Math.random() * 2 - 1) * Math.exp(-j / (bSize * 0.3));

      const popSrc = actx.createBufferSource();
      popSrc.buffer = b;
      const f = actx.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.value = 400 + Math.random() * 600;
      f.Q.value = 4;

      const g = actx.createGain();
      g.gain.setValueAtTime(0.7, t);
      g.gain.exponentialRampToValueAtTime(0.01, t + 0.05);

      popSrc.connect(f);
      f.connect(g);
      g.connect(masterGain);
      popSrc.start();
    }, delay * 1000);
  }
}

function updateAudio(rpm, load) {
  if (!actx || sourceNodes.length === 0) return;

  // Trova i due indici dei campioni da crossfadare
  let lowerIdx = 0;
  for (let i = 0; i < sampleRpmPoints.length - 1; i++) {
    if (rpm >= sampleRpmPoints[i]) lowerIdx = i;
  }
  const upperIdx = Math.min(sampleRpmPoints.length - 1, lowerIdx + 1);

  const lowerRpm = sampleRpmPoints[lowerIdx];
  const upperRpm = sampleRpmPoints[upperIdx];
  const span = Math.max(1, upperRpm - lowerRpm);
  const factor = Math.max(0, Math.min(1, (rpm - lowerRpm) / span));

  const t = actx.currentTime;
  const ramp = 0.05;

  gainNodes.forEach((g, i) => {
    let target = 0;
    if (i === lowerIdx) target = (1 - factor);
    else if (i === upperIdx) target = factor;
    // Boost leggero con carico
    target = target * (0.5 + load * 0.5);
    g.gain.setTargetAtTime(target, t, ramp);

    // Intonazione fine del loop in base a RPM
    const refRpm = sampleRpmPoints[i];
    const rate = Math.max(0.6, Math.min(1.8, rpm / refRpm));
    sourceNodes[i].playbackRate.setTargetAtTime(rate, t, ramp);
  });

  // Frequenza del modulatore warble: 5 cilindri 4T = (RPM / 60) * 2.5 Hz
  const warbleFreq = Math.max(10, (rpm / 60) * 2.5);
  warbleOsc.frequency.setTargetAtTime(warbleFreq, t, ramp);
}

function updatePhysics(spd) {
  if (spd < 1) {
    gear = 1;
    targetRpm = IDLE_RPM;
    throttle = 0;
  } else {
    if (spd < 25) gear = 1;
    else if (spd < 50) gear = 2;
    else if (spd < 85) gear = 3;
    else if (spd < 125) gear = 4;
    else if (spd < 165) gear = 5;
    else gear = 6;

    const wheelCircMeters = 2.05;
    const wheelRpm = (spd * 1000 / 60) / wheelCircMeters;
    targetRpm = Math.max(IDLE_RPM, Math.min(MAX_RPM, wheelRpm * ratios[gear] * finalDrive));
  }

  const now = performance.now();
  const dt = (now - lastTime) / 1000;
  if (dt > 0.05) {
    const accel = (spd - lastSpeed) / dt;
    const newThrottle = Math.max(0, Math.min(1, accel / 15));

    // Deceleration pop se l'utente alza il piede bruscamente da alto RPM
    if (lastThrottle > 0.4 && newThrottle < 0.1 && currentRpm > 3000) {
      triggerPop();
    }
    lastThrottle = throttle;
    throttle = newThrottle;
    lastSpeed = spd;
    lastTime = now;
  }

  currentRpm += (targetRpm - currentRpm) * 0.15;

  if (isRunning) {
    updateAudio(currentRpm, throttle);
  }

  document.getElementById('gear').textContent = spd < 1 ? 'P' : gear;
  document.getElementById('rpm-val').childNodes[0].textContent = Math.round(currentRpm) + ' ';
  document.getElementById('speed-num').textContent = Math.round(spd);
  document.getElementById('bar-fill').style.width = Math.min(100, (currentRpm / MAX_RPM) * 100) + '%';
}

function loop() {
  updatePhysics(currentSpeed);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function startGps() {
  if (!('geolocation' in navigator)) {
    document.getElementById('gps-status').textContent = 'GPS non disp.';
    return;
  }
  geoWatchId = navigator.geolocation.watchPosition(
    pos => {
      const spdKmh = (pos.coords.speed || 0) * 3.6;
      currentSpeed = Math.max(0, spdKmh);
      document.getElementById('gps-status').textContent = `GPS: ±${Math.round(pos.coords.accuracy || 0)}m`;
    },
    err => {
      document.getElementById('gps-status').textContent = 'GPS: ' + err.message;
    },
    { enableHighAccuracy: true, maximumAge: 500, timeout: 5000 }
  );
}

const pBtn = document.getElementById('power-btn');
pBtn.addEventListener('click', async () => {
  if (!isRunning) {
    if (actx.state === 'suspended') await actx.resume();
    initAudioGraph();
    startGps();
    isRunning = true;
    pBtn.textContent = 'SPEGNI MOTORE';
    pBtn.classList.add('stop');
    document.getElementById('diag').textContent = 'Motore a campioni attivo con modulazione 5 cilindri.';
  } else {
    sourceNodes.forEach(s => { try { s.stop(); } catch(e){} });
    sourceNodes = [];
    if (geoWatchId) navigator.geolocation.clearWatch(geoWatchId);
    isRunning = false;
    currentSpeed = 0;
    pBtn.textContent = 'AVVIA MOTORE';
    pBtn.classList.remove('stop');
    document.getElementById('diag').textContent = 'Motore spento.';
  }
});

const sSlider = document.getElementById('sim-slider');
sSlider.addEventListener('input', e => {
  currentSpeed = parseFloat(e.target.value);
  document.getElementById('sim-spd').textContent = currentSpeed;
});
</script>
</body>
</html>
