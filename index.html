<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tesla Wrooom</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none}
body{
  background:#050507;
  color:#f5f5f7;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
  height:100vh;
  display:grid;
  grid-template-rows:auto 1fr auto;
  padding:28px 36px;
  overflow:hidden;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:16px;
  font-weight:600;
  letter-spacing:1px;
  color:#8e8e93;
}
.badge{
  background:#1c1c1e;
  padding:8px 16px;
  border-radius:20px;
  font-size:14px;
  color:#30d158;
}

/* Cluster centrale tipo cockpit Tesla */
.cluster{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:18px;
}
.speed-display{
  display:flex;
  align-items:baseline;
  gap:8px;
}
#speed-num{
  font-size:120px;
  font-weight:800;
  line-height:0.9;
  letter-spacing:-3px;
  font-variant-numeric:tabular-nums;
}
.speed-unit{
  font-size:28px;
  font-weight:600;
  color:#8e8e93;
}

.rpm-container{
  display:flex;
  align-items:center;
  gap:16px;
  font-size:22px;
  font-weight:600;
  color:#a1a1a6;
}
#rpm-val{
  font-size:32px;
  font-weight:700;
  color:#fff;
  font-variant-numeric:tabular-nums;
}
#gear-badge{
  background:#30d158;
  color:#000;
  padding:4px 14px;
  border-radius:8px;
  font-weight:800;
  font-size:20px;
}

/* Barra contagiri */
.bar-track{
  width:100%;
  max-width:720px;
  height:18px;
  background:#1c1c1e;
  border-radius:9px;
  overflow:hidden;
  box-shadow:inset 0 1px 3px rgba(0,0,0,0.8);
}
#bar-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#30d158 0%,#ffd60a 70%,#ff3b30 95%);
  transition:width .05s linear;
}

/* Pannello comandi */
.dashboard-controls{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:16px;
  width:100%;
  max-width:720px;
  margin:0 auto;
}

/* Pulsantone Avvia/Spegni */
.btn-power{
  width:100%;
  padding:22px;
  font-size:22px;
  font-weight:800;
  letter-spacing:1px;
  border:0;
  border-radius:16px;
  background:#ff3b30;
  color:#fff;
  cursor:pointer;
  box-shadow:0 6px 24px rgba(255,59,48,0.35);
  transition:transform .1s ease, background .15s ease;
}
.btn-power:active{
  transform:scale(0.98);
}
.btn-power.stop{
  background:#2c2c2e;
  box-shadow:none;
}
.btn-power:disabled{
  opacity:0.4;
  cursor:not-allowed;
}

/* Slider test banco */
.sim-box{
  width:100%;
  display:flex;
  align-items:center;
  gap:16px;
  font-size:14px;
  color:#8e8e93;
}
.sim-box input{
  flex:1;
  height:12px;
  accent-color:#ff3b30;
  cursor:pointer;
}

.status-line{
  font-size:12px;
  color:#636366;
  text-align:center;
}
.probe-link{
  color:#8e8e93;
  text-decoration:none;
  font-size:12px;
}
.probe-link:hover{
  color:#fff;
}
</style>
</head>
<body>

<header>
  <div>TESLA WROOOM</div>
  <div class="badge" id="gps-status">GPS IN ATTESA</div>
</header>

<div class="cluster">
  <div class="speed-display">
    <div id="speed-num">0</div>
    <div class="speed-unit">km/h</div>
  </div>

  <div class="rpm-container">
    <span id="gear-badge">P</span>
    <span><span id="rpm-val">800</span> RPM</span>
  </div>

  <div class="bar-track">
    <div id="bar-fill"></div>
  </div>
</div>

<div class="dashboard-controls">
  <button id="power-btn" class="btn-power" disabled>CARICAMENTO AUDIO...</button>

  <div class="sim-box">
    <span>TEST BANCO:</span>
    <input type="range" id="sim-slider" min="0" max="260" value="0">
    <span id="sim-spd" style="min-width:65px">0 km/h</span>
  </div>

  <div class="status-line" id="diag">Download campioni...</div>
  <a href="probe.html" class="probe-link">Apri Test Sensori Tesla (probe.html)</a>
</div>

<script>
// ponytail: architettura pura mono-marcia EV con modulazione continua su carico e velocita
const IDLE_RPM = 800, MAX_RPM = 5200;

// Frequenze misurate dei 6 loop WAV: 42.8Hz, 58.8Hz, 61.3Hz, 64.9Hz, 68.8Hz, 73.0Hz
// Rapportate in RPM equivalenti (combustione motore 4 tempi):
const sampleRpmPoints = [800, 1100, 1150, 1220, 1290, 1370];
const sampleFiles = [
  'sounds/loop_0.wav',
  'sounds/loop_1.wav',
  'sounds/loop_2.wav',
  'sounds/loop_3.wav',
  'sounds/loop_4.wav',
  'sounds/loop_5.wav'
];

let actx = null, isRunning = false;
let audioBuffers = [];
let sourceNodes = [], gainNodes = [];
let masterGain = null;
let currentSpeed = 0, targetRpm = IDLE_RPM, currentRpm = IDLE_RPM;
let filteredThrottle = 0;
let lastSpeedSample = 0, lastSpeedSampleTime = performance.now();
let geoWatchId = null;

let gpsSampleCount = 0;
let lastGpsSampleTimestamp = 0;
let gpsHzDisplay = 0;

function createAudioContext() {
  const AC = window.AudioContext || window.webkitAudioContext;
  return new AC({ latencyHint: 'interactive' });
}

function registerSpeedUpdate(spd, isDirectInput = false) {
  const now = performance.now();
  const dt = (now - lastSpeedSampleTime) / 1000;

  if (isDirectInput) {
    if (dt > 0.01) {
      const rawAccel = (spd - lastSpeedSample) / dt;
      const rawThrottle = Math.max(0, Math.min(1, rawAccel / 15));
      filteredThrottle += (rawThrottle - filteredThrottle) * 0.4;
      lastSpeedSample = spd;
      lastSpeedSampleTime = now;
    }
  } else {
    gpsSampleCount++;
    if (lastGpsSampleTimestamp > 0 && dt > 0) {
      const instantHz = 1 / dt;
      gpsHzDisplay = gpsHzDisplay === 0 ? instantHz : (gpsHzDisplay * 0.8 + instantHz * 0.2);
    }
    lastGpsSampleTimestamp = now;

    if (dt > 0.04) {
      const rawAccel = (spd - lastSpeedSample) / dt;
      // Stima carico: 12 km/h al secondo (~0.34g) = 100% gas
      const rawThrottle = Math.max(0, Math.min(1, rawAccel / 12));
      const alpha = rawThrottle > filteredThrottle ? 0.45 : 0.15;
      filteredThrottle += (rawThrottle - filteredThrottle) * alpha;
      lastSpeedSample = spd;
      lastSpeedSampleTime = now;
    }
  }
  currentSpeed = Math.max(0, spd);
}

async function preloadSamples() {
  try {
    actx = createAudioContext();
    document.getElementById('diag').textContent = 'Scaricamento audio...';
    const fetchPromises = sampleFiles.map(async file => {
      const res = await fetch(file);
      if (!res.ok) throw new Error(`HTTP ${res.status} per ${file}`);
      const arrayBuf = await res.arrayBuffer();
      return await decodeAudioCompat(actx, arrayBuf);
    });

    audioBuffers = await Promise.all(fetchPromises);

    const btn = document.getElementById('power-btn');
    btn.disabled = false;
    btn.textContent = 'AVVIA MOTORE';
    updateDiagStatus();
  } catch (err) {
    document.getElementById('diag').textContent = 'Errore suoni: ' + err.message;
  }
}
preloadSamples();

function decodeAudioCompat(context, arrayBuf) {
  return new Promise((resolve, reject) => {
    const res = context.decodeAudioData(arrayBuf, resolve, reject);
    if (res && typeof res.then === 'function') {
      res.then(resolve).catch(reject);
    }
  });
}

function updateDiagStatus() {
  const diagEl = document.getElementById('diag');
  if (!diagEl) return;
  if (!isRunning) {
    diagEl.textContent = 'Audio pronto in RAM. Tocca AVVIA per partire.';
    return;
  }
  const baseLat = actx && actx.baseLatency ? (actx.baseLatency * 1000).toFixed(0) : '?';
  const outLat = actx && actx.outputLatency ? (actx.outputLatency * 1000).toFixed(0) : '?';
  const hzText = gpsHzDisplay > 0 ? `${gpsHzDisplay.toFixed(1)} Hz` : 'attesa';
  diagEl.textContent = `GPS: ${hzText} | Audio buffer: ${baseLat}ms (out: ${outLat}ms) | Gas: ${(filteredThrottle * 100).toFixed(0)}%`;
}

async function initAudioGraph() {
  if (!actx) actx = createAudioContext();
  if (actx.state === 'suspended') await actx.resume();

  if (audioBuffers.length === 0) {
    const fetchPromises = sampleFiles.map(async file => {
      const res = await fetch(file);
      const arrayBuf = await res.arrayBuffer();
      return await decodeAudioCompat(actx, arrayBuf);
    });
    audioBuffers = await Promise.all(fetchPromises);
  }

  masterGain = actx.createGain();
  masterGain.gain.setValueAtTime(0.9, actx.currentTime);
  masterGain.connect(actx.destination);

  sourceNodes = [];
  gainNodes = [];

  audioBuffers.forEach(buf => {
    const src = actx.createBufferSource();
    src.buffer = buf;
    src.loop = true;

    const g = actx.createGain();
    g.gain.setValueAtTime(0, actx.currentTime);

    src.connect(g);
    g.connect(masterGain);

    sourceNodes.push(src);
    gainNodes.push(g);
    src.start();
  });

  updateAudio(currentRpm, filteredThrottle, true);
}

function updateAudio(rpm, load, immediate = false) {
  if (!actx || sourceNodes.length === 0) return;

  const t = actx.currentTime;
  const ramp = immediate ? 0.001 : 0.008;

  let lowerIdx = 0;
  for (let i = 0; i < sampleRpmPoints.length - 1; i++) {
    if (rpm >= sampleRpmPoints[i]) lowerIdx = i;
  }
  const upperIdx = Math.min(sampleRpmPoints.length - 1, lowerIdx + 1);

  const lowerRpm = sampleRpmPoints[lowerIdx];
  const upperRpm = sampleRpmPoints[upperIdx];
  const span = Math.max(1, upperRpm - lowerRpm);
  const factor = Math.max(0, Math.min(1, (rpm - lowerRpm) / span));

  gainNodes.forEach((g, i) => {
    let target = 0;
    if (i === lowerIdx) target = 1 - factor;
    else if (i === upperIdx) target = factor;
    // Modulazione ampiezza con carico: motore sussurrato a filo di gas (0.4), pieno in affondo (1.0)
    target = target * (0.4 + load * 0.6);
    g.gain.setTargetAtTime(target, t, ramp);

    const refRpm = sampleRpmPoints[i];
    // Range playbackRate compatto e naturale (0.75x - 1.45x)
    const rate = Math.max(0.75, Math.min(1.45, rpm / refRpm));
    sourceNodes[i].playbackRate.setTargetAtTime(rate, t, ramp);
  });
}

let lastLoopTime = performance.now();
function updatePhysics(spd) {
  const now = performance.now();
  const dt = Math.min(0.1, (now - lastLoopTime) / 1000);
  lastLoopTime = now;

  if (spd < 1) {
    targetRpm = IDLE_RPM;
  } else {
    // Crociera a gas costante: 50 km/h = 1000 RPM, 90 km/h = 1160 RPM, 130 km/h = 1320 RPM
    // Aggiunta dinamica di carico solo sotto accelerazione: fino a +2000-3000 RPM
    const baseCruiseRpm = IDLE_RPM + (spd / 200) * 800;
    const loadRpm = filteredThrottle * (1200 + (spd / 200) * 1600);
    targetRpm = Math.max(IDLE_RPM, Math.min(MAX_RPM, baseCruiseRpm + loadRpm));
  }

  const rpmFollowFactor = 1 - Math.exp(-dt / 0.04);
  currentRpm += (targetRpm - currentRpm) * rpmFollowFactor;

  if (isRunning) {
    updateAudio(currentRpm, filteredThrottle);
  }

  document.getElementById('gear-badge').textContent = (spd < 1) ? 'P' : 'D';
  document.getElementById('rpm-val').textContent = Math.round(currentRpm);
  document.getElementById('speed-num').textContent = Math.round(spd);
  document.getElementById('bar-fill').style.width = Math.min(100, (currentRpm / MAX_RPM) * 100) + '%';
  updateDiagStatus();
}

function loop() {
  updatePhysics(currentSpeed);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function startGps() {
  if (!('geolocation' in navigator)) {
    document.getElementById('gps-status').textContent = 'NO GPS';
    return;
  }
  geoWatchId = navigator.geolocation.watchPosition(
    pos => {
      const spdKmh = (pos.coords.speed || 0) * 3.6;
      registerSpeedUpdate(spdKmh);
      document.getElementById('gps-status').textContent = `GPS ATTIVO (±${Math.round(pos.coords.accuracy || 0)}m)`;
    },
    err => {
      document.getElementById('gps-status').textContent = 'ERRORE GPS';
    },
    { enableHighAccuracy: true, maximumAge: 500, timeout: 5000 }
  );
}

const pBtn = document.getElementById('power-btn');
pBtn.addEventListener('click', async () => {
  if (!actx) actx = createAudioContext();
  if (actx.state === 'suspended') await actx.resume();

  if (!isRunning) {
    pBtn.disabled = true;
    pBtn.textContent = 'AVVIO...';
    try {
      await initAudioGraph();
      startGps();
      isRunning = true;
      pBtn.textContent = 'SPEGNI MOTORE';
      pBtn.classList.add('stop');
      pBtn.disabled = false;
      document.getElementById('diag').textContent = 'Motore in esecuzione.';
    } catch (e) {
      pBtn.disabled = false;
      pBtn.textContent = 'AVVIA MOTORE';
      document.getElementById('diag').textContent = 'Errore: ' + e.message;
    }
  } else {
    sourceNodes.forEach(s => { try { s.stop(); } catch(e){} });
    sourceNodes = [];
    gainNodes = [];
    if (geoWatchId) navigator.geolocation.clearWatch(geoWatchId);
    isRunning = false;
    currentSpeed = 0;
    pBtn.textContent = 'AVVIA MOTORE';
    pBtn.classList.remove('stop');
    document.getElementById('diag').textContent = 'Motore spento.';
  }
});

const sSlider = document.getElementById('sim-slider');
sSlider.addEventListener('input', e => {
  const val = parseFloat(e.target.value);
  registerSpeedUpdate(val, true);
  document.getElementById('sim-spd').textContent = `${Math.round(val)} km/h`;
});
</script>
</body>
</html>
